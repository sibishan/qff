<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Top Finisher Card · Qiskit Fall Fest 2026 @ UTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;700&display=swap">
<style>
/* Prezzee branded card artwork. Spec: .jpg/.png, min 452 x 242 px.
   Drawn at 3x (1356 x 726) for a crisp export. Prezzee overlays a
   "Smart eGift Card" bar on the bottom ~13%, so keep content above it. */
:root{
  --bg:#1b0a3f;--ink:#FFFFFF;--ink-dim:#E4DCFF;
  --gold:#FFD23F;--orange:#FF8A1F;--pink:#FF5FA8;--lav:#B57BFF;--violet:#6A2BE0;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0}
html,body{background:#0d0520}
body{min-height:100vh;display:grid;place-items:center}
.card{position:relative;width:1356px;height:726px;overflow:hidden;color:var(--ink);font-family:var(--sans);
  background:
    radial-gradient(circle 420px at 78% 42%,rgba(255,95,168,.55),transparent 70%),
    radial-gradient(circle 520px at 92% 0%,rgba(106,43,224,.9),transparent 70%),
    radial-gradient(circle 420px at 0% 100%,rgba(255,138,31,.35),transparent 70%),
    linear-gradient(135deg,#3B0F8C 0%,#24095E 50%,#170540 100%)}

/* decoration */
.ring{position:absolute;border-radius:50%}
.r1{width:620px;height:620px;right:-14px;top:0;border:3px dashed rgba(255,210,63,.55)}
.r2{width:760px;height:760px;right:-84px;top:-70px;border:2px solid rgba(181,123,255,.35)}
.badge{position:absolute;right:96px;top:110px;width:400px;height:400px;transform:rotate(-8deg);
  filter:drop-shadow(14px 14px 0 var(--violet)) drop-shadow(0 0 60px rgba(255,95,168,.7))}
.bird{position:absolute;right:-40px;top:-50px;width:250px;transform:rotate(14deg);
  filter:drop-shadow(0 10px 30px rgba(0,0,0,.35))}
.spark{position:absolute;color:var(--gold);filter:drop-shadow(0 0 12px rgba(255,210,63,.9))}
.s1{left:740px;top:96px;width:44px}
.s2{left:700px;top:500px;width:30px;color:var(--pink);filter:drop-shadow(0 0 12px rgba(255,95,168,.9))}
.s3{right:70px;top:540px;width:36px}

/* content */
.content{position:absolute;left:84px;top:64px;width:760px;display:flex;flex-direction:column;gap:18px}
.logos{display:flex;align-items:center;gap:22px}
.logos img{height:58px;width:auto}
.logos .tall{height:76px}
.logos .x{font-size:34px;color:var(--pink)}
.eyebrow{font-family:var(--mono);font-size:26px;letter-spacing:6px;text-transform:uppercase;color:var(--pink);margin-top:18px;
  text-shadow:0 0 18px rgba(255,95,168,.6)}
.title{font-size:128px;white-space:nowrap;font-weight:700;line-height:.9;letter-spacing:-5px;text-transform:uppercase;
  background:linear-gradient(90deg,var(--gold) 0%,#FFB21F 45%,var(--orange) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(8px 8px 0 var(--pink)) drop-shadow(0 0 40px rgba(255,210,63,.45))}
.sub{font-size:38px;font-weight:700;line-height:1.2}
.sub span{color:var(--ink-dim);font-weight:400}
.partners{display:flex;align-items:center;gap:30px;margin-top:14px}
.partners img{width:auto}
.partners .act{height:40px}
.partners .ibm{height:36px}
.partners .sep{width:2px;height:38px;background:rgba(255,255,255,.35)}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="ring r2" aria-hidden="true"></div>
  <div class="ring r1" aria-hidden="true"></div>
  <img class="badge" src="img/badge-pink.svg" alt="" aria-hidden="true">
  <img class="bird" src="img/sticker-bluebird.svg" alt="" aria-hidden="true">
  <svg class="spark s1" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0c1 7 5 11 12 12-7 1-11 5-12 12-1-7-5-11-12-12 7-1 11-5 12-12z"/></svg>
  <svg class="spark s2" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0c1 7 5 11 12 12-7 1-11 5-12 12-1-7-5-11-12-12 7-1 11-5 12-12z"/></svg>
  <svg class="spark s3" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0c1 7 5 11 12 12-7 1-11 5-12 12-1-7-5-11-12-12 7-1 11-5 12-12z"/></svg>

  <div class="content">
    <div class="logos">
      <img src="img/quts-logo-text.png" alt="Quantum@UTS">
      <span class="x" aria-hidden="true">×</span>
      <img class="tall" src="img/progsoc-logo.png" alt="ProgSoc">
    </div>
    <p class="eyebrow">Quantum Game Jam</p>
    <h1 class="title">Top<br>Finisher</h1>
    <p class="sub">Qiskit Fall Fest 2026 <span>@ UTS</span></p>
    <div class="partners">
      <img class="act" src="img/activateuts.png" alt="ActivateUTS">
      <span class="sep" aria-hidden="true"></span>
      <img class="ibm" src="img/ibm-quantum-white.png" alt="IBM Quantum">
    </div>
  </div>
</div>
</body>
</html>
